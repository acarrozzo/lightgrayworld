# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  # Everything that can be verified without a database or a running server.
  # The deploy waits on this, so a dangling item slug, a broken room exit, a type
  # error or a failing invariant is caught here instead of on the live machine.
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` runs the postinstall `prisma generate`, which needs no database.
      - run: npm ci
      # `src/lib/icon-mappings.ts` and the sprite sheet are generated from
      # `public/icons` and deliberately untracked, so typecheck and lint need
      # them built first; `npm run build` does this via build-with-icons.js.
      - name: Generate icons
        run: npm run generate-icons
      - name: Validate quests
        run: npm run validate-quests
      - name: Validate world
        run: npm run validate-world
      - name: Validate themes
        run: npm run validate-themes
      # The stylesheet is generated from the theme definitions and committed;
      # a theme edited without regenerating it would ship the old colours.
      - name: Generated theme CSS is in sync
        run: npm run generate-themes && git diff --exit-code -- src/app/generated-themes.css
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  deploy:
    name: Deploy app
    needs: check
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
